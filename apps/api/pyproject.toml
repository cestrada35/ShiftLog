[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.importlinter]
root_packages = ["domain", "infrastructure", "interfaces"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "interfaces",
    "infrastructure",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain does not import Django or DRF"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["django", "rest_framework"]