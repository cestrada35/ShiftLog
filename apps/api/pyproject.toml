[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "**/migrations",      # Django autogenerated — never lint
]

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
"interfaces/http/*.py" = ["RUF012"]
"infrastructure/django/models/*.py" = ["RUF012"]

[tool.importlinter]
root_packages = ["domain", "infrastructure", "interfaces"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "interfaces",
    "infrastructure",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain does not import Django or DRF"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["django", "rest_framework"]