openapi: 3.1.0

info:
  title: ShiftLog API
  version: 0.1.0
  description: |
    Timekeeping API for ShiftLog. Serves two personas:
    volunteers (via kiosk) and admins (via dashboard).

servers:
  - url: /api
    description: Same-origin (proxied through Nginx)

tags:
  - name: kiosk
    description: Endpoints used by the volunteer kiosk

paths:
  /kiosk/auth:
    post:
      tags: [kiosk]
      summary: Identify a volunteer by PIN
      operationId: kioskAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskAuthRequest'
      responses:
        '200':
          description: Volunteer identified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskAuthResponse'
        '401':
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/projects:
    get:
      tags: [kiosk]
      summary: List active projects
      operationId: listProjects
      responses:
        '200':
          description: A list of active projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

  /kiosk/check-in:
    post:
      tags: [kiosk]
      summary: Start a shift
      operationId: checkIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Shift started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '409':
          description: Volunteer already has an active shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/check-out:
    post:
      tags: [kiosk]
      summary: End an active shift
      operationId: checkOut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '200':
          description: Shift completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '409':
          description: Shift is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    KioskAuthRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 6
          pattern: '^[0-9]+$'

    KioskAuthResponse:
      type: object
      required: [volunteer, activeShift]
      properties:
        volunteer:
          $ref: '#/components/schemas/Volunteer'
        activeShift:
          oneOf:
            - $ref: '#/components/schemas/Shift'
            - type: 'null'

    Volunteer:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    Shift:
      type: object
      required: [id, volunteerId, projectId, startedAt, endedAt]
      properties:
        id:
          type: string
          format: uuid
        volunteerId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    CheckInRequest:
      type: object
      required: [volunteerId, projectId]
      properties:
        volunteerId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid

    CheckOutRequest:
      type: object
      required: [shiftId]
      properties:
        shiftId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string