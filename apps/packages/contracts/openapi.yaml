openapi: 3.1.0

info:
  title: ShiftLog API
  version: 0.1.0
  description: |
    Timekeeping API for ShiftLog. Serves two personas:
    volunteers (via kiosk) and admins (via dashboard).

servers:
  - url: /api
    description: Same-origin (proxied through Nginx)

tags:
  - name: kiosk
    description: Endpoints used by the volunteer kiosk

paths:
  /kiosk/auth:
    post:
      tags: [kiosk]
      summary: Identify a volunteer by PIN
      operationId: kioskAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskAuthRequest'
      responses:
        '200':
          description: Volunteer identified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskAuthResponse'
        '401':
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/projects:
    get:
      tags: [kiosk]
      summary: List active projects
      operationId: listProjects
      responses:
        '200':
          description: A list of active projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

  /kiosk/check-in:
    post:
      tags: [kiosk]
      summary: Start a shift
      operationId: checkIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Shift started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '409':
          description: Volunteer already has an active shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kiosk/check-out:
    post:
      tags: [kiosk]
      summary: End an active shift
      operationId: checkOut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '200':
          description: Shift completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '409':
          description: Shift is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/whoami:
    get:
      tags: [admin]
      summary: Return the current admin's profile
      operationId: adminWhoAmI
      security:
        - AdminHeader: []
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: Missing or invalid admin identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/volunteers:
    get:
      tags: [admin]
      summary: List all volunteers
      security:
        - AdminHeader: []
      responses:
        '200':
          description: All volunteers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Volunteer'
    post:
      tags: [admin]
      summary: Create a volunteer and return generated credentials
      security:
        - AdminHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Volunteer created. PIN and password are shown once.
          content:
            application/json:
              schema:
                type: object
                required: [volunteer, pin, password]
                properties:
                  volunteer:
                    $ref: '#/components/schemas/Volunteer'
                  pin:
                    type: string
                  password:
                    type: string

  /admin/volunteers/{volunteerId}:
    patch:
      tags: [admin]
      summary: Update a volunteer's name or active state
      security:
        - AdminHeader: []
      parameters:
        - in: path
          name: volunteerId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volunteer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
/admin/dashboard/stats:
  get:
    tags: [admin]
    summary: Get aggregate stats for the admin dashboard
    security:
      - AdminHeader: []
    responses:
      '200':
        description: Dashboard stats
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardStats'
      '401':
        description: Missing or invalid admin identity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    AdminHeader:
      type: apiKey
      in: header
      name: X-Admin-Id
  schemas:
    KioskAuthRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 6
          pattern: '^[0-9]+$'

    KioskAuthResponse:
      type: object
      required: [volunteer, activeShift]
      properties:
        volunteer:
          $ref: '#/components/schemas/Volunteer'
        activeShift:
          oneOf:
            - $ref: '#/components/schemas/Shift'
            - type: 'null'

    Volunteer:
      type: object
      required: [id, name, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isActive:
          type: boolean

    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    Shift:
      type: object
      required: [id, volunteerId, projectId, startedAt, endedAt]
      properties:
        id:
          type: string
          format: uuid
        volunteerId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    CheckInRequest:
      type: object
      required: [volunteerId, projectId]
      properties:
        volunteerId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid

    CheckOutRequest:
      type: object
      required: [shiftId]
      properties:
        shiftId:
          type: string
          format: uuid

    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    RecentShift:
      type: object
      required: [id, volunteerName, projectName, startedAt, endedAt]
      properties:
        id:
          type: string
          format: uuid
        volunteerName:
          type: string
        projectName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    DashboardStats:
      type: object
      required: [totalVolunteers, activeVolunteers, totalProjects, activeProjects, shiftsToday, recentShifts]
      properties:
        totalVolunteers:
          type: integer
        activeVolunteers:
          type: integer
        totalProjects:
          type: integer
        activeProjects:
          type: integer
        shiftsToday:
          type: integer
        recentShifts:
          type: array
          items:
            $ref: '#/components/schemas/RecentShift'