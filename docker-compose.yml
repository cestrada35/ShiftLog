services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/cestrada35/shiftlog-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PIN_HASH_SECRET: ${PIN_HASH_SECRET}
      SHIFTLOG_DEMO_MODE: ${SHIFTLOG_DEMO_MODE:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/cestrada35/shiftlog-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PRIMEUI_LICENSE: ${PRIMEUI_LICENSE}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./docker/web/.htpasswd:/etc/nginx/.htpasswd:ro
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data: