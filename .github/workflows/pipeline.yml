name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs cancel each other; main deploys queue up (no racing)
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/cestrada35/shiftlog-api
  IMAGE_WEB: ghcr.io/cestrada35/shiftlog-web

jobs:
  # ---------- Quality gates ----------

  api-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: lint-imports

  api-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shiftlog_test
          POSTGRES_USER: shiftlog
          POSTGRES_PASSWORD: shiftlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-not-a-secret
      PIN_HASH_SECRET: ci-not-a-secret
      SHIFTLOG_DEMO_MODE: "true"
      DJANGO_DEBUG: "false"
      DJANGO_DB_ENGINE: 'postgres'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: shiftlog_test
      POSTGRES_USER: shiftlog
      POSTGRES_PASSWORD: shiftlog
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  web-quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Contract types are up to date
        run: |
          npm run contract:generate
          git diff --exit-code -- app/lib/api/types.ts
      - run: npm run typecheck
      - run: npm test
 
  e2e:
    runs-on: ubuntu-latest
    needs: [api-test, web-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stack
        run: |
          cp .env.example .env
          sed -i 's|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-not-a-secret|' .env
          sed -i 's|^PIN_HASH_SECRET=.*|PIN_HASH_SECRET=ci-not-a-secret|' .env
          sed -i 's|^SHIFTLOG_DEMO_MODE=.*|SHIFTLOG_DEMO_MODE=true|' .env
          sed -i 's|^DJANGO_ALLOWED_HOSTS=.*|DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1|' .env
          sed -i 's|^DJANGO_DB_ENGINE=.*|DJANGO_DB_ENGINE=postgres|' .env
          touch docker/web/.htpasswd

      - name: Boot the stack
        run: docker compose up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "web never came up"; docker compose logs; exit 1

      - name: Playwright
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - if: always()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
  # ---------- Build + push (main only) ----------

  build-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-lint, api-test]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web-quality, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          build-args: |
            PRIMEUI_LICENSE=${{ secrets.PRIMEUI_LICENSE }}
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------- Deploy (main only) ----------

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-api, build-web]     # transitively gated by e2e now
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shiftlog.dev
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/ShiftLog
            git fetch origin main
            git reset --hard origin/main
            ~/deploy.sh ${{ github.sha }}

      - name: Healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://shiftlog.dev/api/kiosk/projects >/dev/null; then
              echo "deploy healthy"; exit 0
            fi
            sleep 2
          done
          echo "healthcheck failed"; exit 1

      - name: Regression canary — photography-booking
        run: |
          if ! curl -fsS https://helenstudioservices.com/ >/dev/null; then
            echo "photography-booking is DOWN"; exit 1
          fi
          echo "photography-booking still healthy"
